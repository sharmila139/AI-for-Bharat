[tool.poetry]
name = "ruralconnect-ml"
version = "1.0.0"
description = "ML services for RuralConnect AI"
authors = ["RuralConnect AI Team"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
boto3 = "^1.29.7"
tensorflow = "^2.14.0"
torch = "^2.1.0"
transformers = "^4.35.0"
scikit-learn = "^1.3.2"
opencv-python = "^4.8.1"
pytesseract = "^0.3.10"
prophet = "^1.1.5"

[tool.poetry.dev-dependencies]
pytest = "^7.4.3"
black = "^23.11.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
